name: Karakoram Python CI/CD

on:
  push:
    branches: [ main ]  # جب آپ main برانچ پر کوڈ پش کریں گی

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/karakoram-python:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }} # یا SSH Key استعمال کریں
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/karakoram-python:latest
            docker stop karakoram-app || true
            docker rm karakoram-app || true
            docker run -d --name karakoram-app -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/karakoram-python:latest
